org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# El proyecto vive en D: pero la cache de Gradle/Kotlin y el Pub Cache viven en C:.
# La compilacion incremental de Kotlin intenta calcular rutas relativas entre discos
# distintos, lo cual no existe en Windows y hace fallar el build (IllegalArgumentException
# "this and base files have different roots"). Se desactiva para evitarlo.
kotlin.incremental=false
